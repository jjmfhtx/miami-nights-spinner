<title>Miami Nights Spinner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&family=Outfit:wght@400;700;900&display=swap">
<style>
  /* Layout: centered single-column, full-height Miami Vice app */
  :root {
    --bg: #f0f4f3;
    --surface: #dfe8e5;
    --fg: #1b3a2d;
    --fg-muted: #5a7a6d;
    --accent: #ff2d7b;
    --accent-glow: rgba(255, 45, 123, 0.3);
    --teal: #00b89c;
    --teal-deep: #007a68;
    --pink: #ff2d7b;
    --pink-light: #ff6da0;
    --green-dark: #174a3a;
    --green-mid: #1e6350;
    --win-bg: #ff2d7b;
    --lose-dark: #174a3a;
    --lose-mid: #1e6350;
    --wheel-border: #00b89c;
    --btn-bg: #ff2d7b;
    --btn-fg: #fff;
    --btn-hover: #e6266e;
    --result-winner-bg: #00b89c;
    font-family: 'Outfit', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a1f18;
      --surface: #122e24;
      --fg: #e0f5ee;
      --fg-muted: #7aafa0;
      --accent: #ff2d7b;
      --accent-glow: rgba(255, 45, 123, 0.35);
      --teal: #00e4c1;
      --teal-deep: #00b89c;
      --pink: #ff4d90;
      --pink-light: #ff80b5;
      --green-dark: #0d2a20;
      --green-mid: #153d30;
      --win-bg: #ff2d7b;
      --lose-dark: #0d2a20;
      --lose-mid: #153d30;
      --wheel-border: #00e4c1;
      --btn-bg: #ff2d7b;
      --btn-fg: #fff;
      --btn-hover: #ff4d90;
      --result-winner-bg: #00e4c1;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a1f18;
    --surface: #122e24;
    --fg: #e0f5ee;
    --fg-muted: #7aafa0;
    --accent: #ff2d7b;
    --accent-glow: rgba(255, 45, 123, 0.35);
    --teal: #00e4c1;
    --teal-deep: #00b89c;
    --pink: #ff4d90;
    --pink-light: #ff80b5;
    --green-dark: #0d2a20;
    --green-mid: #153d30;
    --win-bg: #ff2d7b;
    --lose-dark: #0d2a20;
    --lose-mid: #153d30;
    --wheel-border: #00e4c1;
    --btn-bg: #ff2d7b;
    --btn-fg: #fff;
    --btn-hover: #ff4d90;
    --result-winner-bg: #00e4c1;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding-inline: 16px;
    padding-block: 0;
    margin: 0;
    text-align: center;
    overflow-x: hidden;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    max-width: 420px;
    width: 100%;
  }

  .logo {
    width: clamp(180px, 50vw, 260px);
    height: auto;
    margin: 0;
    filter: drop-shadow(0 0 20px var(--accent-glow));
  }

  .subtitle {
    color: var(--fg-muted);
    font-size: 0.85rem;
    margin: 0;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .wheel-wrap {
    position: relative;
    width: min(320px, 80vw);
    height: min(320px, 80vw);
  }

  .wheel-wrap canvas {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 28px var(--accent-glow)) drop-shadow(0 0 60px rgba(0, 184, 156, 0.15));
  }

  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 30px solid var(--pink);
    z-index: 2;
    filter: drop-shadow(0 2px 8px var(--accent-glow));
  }

  .center-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--pink);
    border: 3px solid var(--bg);
    z-index: 2;
    box-shadow: 0 0 16px var(--accent-glow);
  }

  #result {
    font-family: 'Righteous', cursive;
    font-size: clamp(1.2rem, 4vw, 1.6rem);
    font-weight: 400;
    min-height: 2.4em;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 28px;
    border-radius: 14px;
    background: var(--surface);
    border: 2px solid transparent;
    transition: background 0.3s, color 0.3s, transform 0.3s, border-color 0.3s;
    width: 100%;
    box-sizing: border-box;
  }

  #result.winner {
    background: var(--result-winner-bg);
    color: #fff;
    border-color: var(--pink);
    transform: scale(1.08);
    animation: pulse 0.5s ease-in-out 3;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1.08); }
    50% { transform: scale(1.15); }
  }

  #spinBtn {
    font-family: 'Righteous', cursive;
    font-size: 1.2rem;
    font-weight: 400;
    padding: 14px 52px;
    border: none;
    border-radius: 60px;
    background: var(--btn-bg);
    color: var(--btn-fg);
    cursor: pointer;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 0 20px var(--accent-glow);
  }

  #spinBtn:hover {
    background: var(--btn-hover);
    box-shadow: 0 0 32px var(--accent-glow);
  }
  #spinBtn:active { transform: scale(0.96); }
  #spinBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .theme-toggle {
    position: fixed;
    top: env(safe-area-inset-top, 8px);
    right: 16px;
    margin-top: 8px;
    background: var(--surface);
    border: 2px solid var(--teal);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg-muted);
    transition: background 0.2s, border-color 0.2s;
    z-index: 10;
  }
  .theme-toggle:hover {
    background: var(--accent-glow);
    border-color: var(--pink);
  }

  #confetti-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
  }
</style>

<button class="theme-toggle" id="themeBtn" aria-label="Toggle theme"></button>
<canvas id="confetti-canvas"></canvas>

<div class="container">
  <img src="logo.png" alt="Miami Nights" class="logo">
  <p class="subtitle">Land on pink to win</p>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="640" height="640"></canvas>
    <div class="center-dot"></div>
  </div>

  <div id="result">Give it a spin!</div>
  <button id="spinBtn">Spin</button>
</div>

<script>
(() => {
  const themeBtn = document.getElementById('themeBtn');
  const root = document.documentElement;

  function getEffectiveDark() {
    const dt = root.getAttribute('data-theme');
    if (dt === 'dark') return true;
    if (dt === 'light') return false;
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function updateThemeIcon() {
    themeBtn.textContent = getEffectiveDark() ? '☀' : '☾';
  }

  themeBtn.addEventListener('click', () => {
    const isDark = getEffectiveDark();
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
    updateThemeIcon();
    drawWheel(currentAngle);
  });

  updateThemeIcon();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    updateThemeIcon();
    drawWheel(currentAngle);
  });

  const SEGMENTS = 10;
  const WIN_INDEX = 0;
  const SEGMENT_ANGLE = (2 * Math.PI) / SEGMENTS;

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const R = W / 2 - 8;
  const CX = W / 2;
  const CY = H / 2;

  let currentAngle = 0;
  let spinning = false;

  function getColor(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function drawWheel(rotation) {
    ctx.clearRect(0, 0, W, H);

    const loseDark = getColor('--lose-dark');
    const loseMid = getColor('--lose-mid');
    const winColor = getColor('--pink');
    const tealColor = getColor('--teal');
    const borderColor = getColor('--wheel-border');
    const isDark = getEffectiveDark();

    for (let i = 0; i < SEGMENTS; i++) {
      const start = rotation + i * SEGMENT_ANGLE;
      const end = start + SEGMENT_ANGLE;

      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.arc(CX, CY, R, start, end);
      ctx.closePath();

      if (i === WIN_INDEX) {
        ctx.fillStyle = winColor;
      } else {
        ctx.fillStyle = i % 2 === 0 ? loseDark : loseMid;
      }
      ctx.fill();

      // Segment divider lines in teal
      ctx.strokeStyle = tealColor;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Horizontal scan-line effect on lose segments
      if (i !== WIN_INDEX) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.arc(CX, CY, R, start, end);
        ctx.closePath();
        ctx.clip();

        ctx.strokeStyle = isDark ? 'rgba(0, 228, 193, 0.08)' : 'rgba(0, 184, 156, 0.07)';
        ctx.lineWidth = 1;
        const step = 8;
        for (let y = 0; y < H; y += step) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Labels
      const mid = start + SEGMENT_ANGLE / 2;
      const labelR = R * 0.65;
      const tx = CX + Math.cos(mid) * labelR;
      const ty = CY + Math.sin(mid) * labelR;

      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(mid + Math.PI / 2);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (i === WIN_INDEX) {
        ctx.font = 'bold 26px "Righteous", cursive';
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 4;
        ctx.fillText('WIN', 0, 0);
      } else {
        ctx.font = '18px "Righteous", cursive';
        ctx.fillStyle = isDark ? 'rgba(0, 228, 193, 0.25)' : 'rgba(0, 184, 156, 0.3)';
        ctx.fillText('•', 0, 0);
      }
      ctx.restore();
    }

    // Outer ring - thicker teal glow
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, 2 * Math.PI);
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 5;
    ctx.stroke();

    // Inner ring accent
    ctx.beginPath();
    ctx.arc(CX, CY, 30, 0, 2 * Math.PI);
    ctx.strokeStyle = winColor;
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  drawWheel(currentAngle);

  const spinBtn = document.getElementById('spinBtn');
  const resultEl = document.getElementById('result');
  let ACTUAL_WIN_CHANCE = 1 / 50;

  fetch('config.json?' + Date.now())
    .then(r => r.json())
    .then(cfg => { if (cfg.odds > 0) ACTUAL_WIN_CHANCE = 1 / cfg.odds; })
    .catch(() => {});

  spinBtn.addEventListener('click', () => {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    resultEl.textContent = '...';
    resultEl.classList.remove('winner');

    const isWinner = Math.random() < ACTUAL_WIN_CHANCE;

    const fullSpins = 2 + Math.floor(Math.random() * 2);
    let targetSegment;

    if (isWinner) {
      targetSegment = WIN_INDEX;
    } else {
      targetSegment = 1 + Math.floor(Math.random() * (SEGMENTS - 1));
    }

    const jitter = (Math.random() - 0.5) * SEGMENT_ANGLE * 0.7;
    const targetAngle = -Math.PI / 2 - targetSegment * SEGMENT_ANGLE - SEGMENT_ANGLE / 2 + jitter;
    const totalRotation = fullSpins * 2 * Math.PI + (targetAngle - (currentAngle % (2 * Math.PI)) + 4 * Math.PI) % (2 * Math.PI);

    const startAngle = currentAngle;
    const duration = 900 + Math.random() * 300;
    const startTime = performance.now();

    function easeOutQuart(t) {
      return 1 - Math.pow(1 - t, 4);
    }

    function animate(now) {
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      const eased = easeOutQuart(t);

      currentAngle = startAngle + totalRotation * eased;
      drawWheel(currentAngle);

      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        spinning = false;
        spinBtn.disabled = false;

        if (isWinner) {
          resultEl.textContent = 'WINNER!';
          resultEl.classList.add('winner');
          launchConfetti();
        } else {
          resultEl.textContent = 'Not a winner';
          resultEl.classList.remove('winner');
        }
      }
    }

    requestAnimationFrame(animate);
  });

  // Confetti - Miami colors
  const confettiCanvas = document.getElementById('confetti-canvas');
  const cCtx = confettiCanvas.getContext('2d');
  let particles = [];
  let confettiActive = false;

  function resizeConfetti() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  resizeConfetti();
  window.addEventListener('resize', resizeConfetti);

  function launchConfetti() {
    particles = [];
    const colors = ['#ff2d7b', '#00e4c1', '#00b89c', '#ff6da0', '#ff80b5', '#fff', '#174a3a', '#ffd93d'];

    for (let i = 0; i < 220; i++) {
      particles.push({
        x: confettiCanvas.width / 2 + (Math.random() - 0.5) * 240,
        y: confettiCanvas.height / 2,
        vx: (Math.random() - 0.5) * 20,
        vy: -Math.random() * 24 - 6,
        w: 5 + Math.random() * 7,
        h: 3 + Math.random() * 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * Math.PI * 2,
        rv: (Math.random() - 0.5) * 0.35,
        gravity: 0.26 + Math.random() * 0.12,
        life: 1,
        decay: 0.005 + Math.random() * 0.005,
      });
    }

    if (!confettiActive) {
      confettiActive = true;
      animateConfetti();
    }
  }

  function animateConfetti() {
    cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

    particles = particles.filter(p => p.life > 0);

    for (const p of particles) {
      p.x += p.vx;
      p.vy += p.gravity;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rotation += p.rv;
      p.life -= p.decay;

      cCtx.save();
      cCtx.translate(p.x, p.y);
      cCtx.rotate(p.rotation);
      cCtx.globalAlpha = Math.max(0, p.life);
      cCtx.fillStyle = p.color;
      cCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cCtx.restore();
    }

    if (particles.length > 0) {
      requestAnimationFrame(animateConfetti);
    } else {
      confettiActive = false;
      cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }
  }

  const observer = new MutationObserver(() => {
    updateThemeIcon();
    drawWheel(currentAngle);
  });
  observer.observe(root, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
